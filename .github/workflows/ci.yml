name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" -e ./sdk
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" -e ./sdk
      # Fast suite: Presidio detection is replaced by a fake; the real models run below.
      - run: pytest -q -m "not presidio"

  masking-eval:
    name: Masking evaluation (Presidio + spaCy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-models.txt
      - run: pip install -e ".[dev]" -e ./sdk -r requirements-models.txt
      - run: pytest -q -m presidio
      # Fails the build if recall drops below the threshold; the table is shown on the run page.
      - run: python eval/masking/run_eval.py --min-recall 0.90

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/relay
      - run: helm template relay deploy/helm/relay
      - run: helm template relay deploy/helm/relay --set existingSecret=relay-secrets

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.1
      - run: terraform fmt -check -recursive
      # -backend=false: validate the code without any cloud credentials or state.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not only the last commit
      # The pinned gitleaks binary scans the WHOLE git history on every run (the official
      # action scans only the pushed commit range, which breaks on a repository's first push).
      # .gitleaks.toml (default rules + one narrow allowlist) is picked up automatically.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git . --redact --verbose
