[project]
name = "relay"
version = "0.1.0"
description = "Relay: an enterprise LLM gateway with PII masking, routing, budgets and observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "sdk/tests", "examples/rag_assistant/tests"]
markers = [
    "presidio: needs the spaCy models (en_core_web_lg, fr_core_news_md) installed",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# S101 (assert) is fine in tests; S105/S106 flag the fake keys used in tests.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"eval/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "sdk/relay_client", "examples/rag_assistant/rag.py"]
# Presidio and spaCy ship without type hints.
[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*"]
ignore_missing_imports = true
