{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  {{- with .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.geminiApiKey }}
  gemini-api-key: {{ . | quote }}
  {{- end }}
  teams.json: {{ .Values.secrets.teamsJson | quote }}
{{- end }}
