# OpenTelemetry Collector: receives Relay's spans over OTLP and forwards them.
# The "debug" exporter prints a summary of each span to the collector's log, which is enough
# to see traces locally (`docker compose logs otel-collector`). To keep traces, add an
# exporter for your backend (Tempo, Jaeger, Honeycomb, Datadog...) to the pipeline below.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
